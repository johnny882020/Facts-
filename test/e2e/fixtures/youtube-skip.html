<!doctype html>
<!-- modeled on youtube.com skip-ad button pattern, captured/authored 2026-11-05, NOT a live capture -->
<html lang="en"><head><meta charset="utf-8"><title>fixture</title>
<style>body{margin:0;font-family:sans-serif;min-height:100vh}.modal{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center}.box{background:#fff;padding:24px;min-width:300px;position:relative}</style>
<script>window.__closed=0;</script></head><body>
<main><h1>Page content</h1><p>Article text.</p></main>
<div id="movie_player" class="html5-video-player ad-showing ad-interrupting"><video></video>
<div class="video-ads ytp-ad-module"><div class="ytp-ad-player-overlay"><span class="ytp-ad-text">Ad 1 of 1 · <span id="cd">1</span></span></div></div></div>
<script>setTimeout(()=>{document.querySelector('.video-ads').insertAdjacentHTML('beforeend','<div class="ytp-ad-skip-button-slot"><div class="ytp-ad-skip-button-container"><button class="ytp-skip-ad-button ytp-ad-skip-button-modern" id="skip"><div class="ytp-skip-ad-button__text">Skip</div></button></div></div>');document.getElementById('skip').addEventListener('click',e=>{window.__closed++;e.currentTarget.closest('.ytp-ad-skip-button-slot').remove();});},1000);</script>
</body></html>
