<!doctype html>
<!-- modeled on open.spotify.com upsell dialog pattern, captured/authored 2026-11-05, NOT a live capture -->
<html lang="en"><head><meta charset="utf-8"><title>fixture</title>
<style>body{margin:0;font-family:sans-serif;min-height:100vh}.modal{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center}.box{background:#fff;padding:24px;min-width:300px;position:relative}</style>
<script>window.__closed=0;</script></head><body>
<main><h1>Page content</h1><p>Article text.</p></main>
<script>setTimeout(()=>{document.body.insertAdjacentHTML('beforeend', `<div class="modal" id="ov"><div class="box" role="dialog" aria-modal="true" data-testid="upsell-dialog"><h2>Go Premium</h2><p>Upgrade for ad-free music. Try 3 months free trial.</p><button data-testid="close-button" aria-label="Close" id="x">×</button></div></div>`);document.getElementById('x').addEventListener('click',()=>{window.__closed++;document.getElementById('ov').remove();});},300);</script>
</body></html>
