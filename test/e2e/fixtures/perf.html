<!doctype html>
<!-- modeled on 5000-node page pattern, captured/authored 2026-11-05, NOT a live capture -->
<html lang="en"><head><meta charset="utf-8"><title>fixture</title>
<style>body{margin:0;font-family:sans-serif;min-height:100vh}.modal{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center}.box{background:#fff;padding:24px;min-width:300px;position:relative}</style>
<script>window.__closed=0;</script></head><body>
<main><h1>Page content</h1><p>Article text.</p></main>
<div id="root"></div><script>const r=document.getElementById('root');const f=document.createDocumentFragment();for(let i=0;i<1000;i++){const d=document.createElement('div');d.className='row';d.innerHTML='<span>a '+i+'</span><b>b</b><i>c</i><a href="#">d</a>';f.appendChild(d);}r.appendChild(f);
window.__longTasks=0;new PerformanceObserver(l=>{for(const e of l.getEntries())window.__longTasks+=e.duration}).observe({entryTypes:['longtask']});
window.__mutate=()=>{const t=performance.now();const d=document.createElement('div');d.id='late';d.setAttribute('role','dialog');d.style.cssText='position:fixed;inset:0;z-index:1000';d.innerHTML='<p>Subscribe to our newsletter. Discount offer.</p><button id="x" aria-label="Close">Close</button>';document.body.appendChild(d);document.getElementById('x').addEventListener('click',()=>{window.__closed++;d.remove();});return performance.now()-t;};</script></body></html>
