<!doctype html>
<!-- modeled on generic iframe-hosted newsletter popup (inner frame) pattern, captured/authored 2026-11-05, NOT a live capture -->
<html lang="en"><head><meta charset="utf-8"><title>fixture</title>
<style>body{margin:0;font-family:sans-serif;min-height:100vh}.modal{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center}.box{background:#fff;padding:24px;min-width:300px;position:relative}</style>
<script>window.__closed=0;</script></head><body>
<main><h1>Page content</h1><p>Article text.</p></main>
<div class="box" role="dialog" aria-modal="true" style="position:fixed;inset:0;z-index:1000;background:#fff"><h2>Subscribe to our newsletter</h2><p>Get a discount on your first order. Sign up for offers.</p><button id="x" aria-label="Close">Close</button></div>
<script>document.getElementById('x').addEventListener('click',()=>{window.__closed++;parent.postMessage('closed','*');});</script></body></html>
