<!doctype html>
<!-- modeled on generic shadow-DOM newsletter popup pattern, captured/authored 2026-11-05, NOT a live capture -->
<html lang="en"><head><meta charset="utf-8"><title>fixture</title>
<style>body{margin:0;font-family:sans-serif;min-height:100vh}.modal{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center}.box{background:#fff;padding:24px;min-width:300px;position:relative}</style>
<script>window.__closed=0;</script></head><body>
<main><h1>Page content</h1><p>Article text.</p></main>
<script>setTimeout(()=>{const host=document.createElement('div');document.body.appendChild(host);const r=host.attachShadow({mode:'open'});r.innerHTML=`<style>.modal{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center}.box{background:#fff;padding:24px}</style><div class="modal"><div class="box" role="dialog" aria-modal="true"><h2>Subscribe to our newsletter</h2><p>Get a discount. Sign up for offers.</p><button id="x" aria-label="Close">Close</button></div></div>`;r.getElementById('x').addEventListener('click',()=>{window.__closed++;host.remove();});},300);</script>
</body></html>
