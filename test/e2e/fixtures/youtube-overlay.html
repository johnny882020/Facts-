<!doctype html>
<!-- modeled on youtube.com ad overlay close pattern, captured/authored 2026-11-05, NOT a live capture -->
<html lang="en"><head><meta charset="utf-8"><title>fixture</title>
<style>body{margin:0;font-family:sans-serif;min-height:100vh}.modal{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center}.box{background:#fff;padding:24px;min-width:300px;position:relative}</style>
<script>window.__closed=0;</script></head><body>
<main><h1>Page content</h1><p>Article text.</p></main>
<div id="movie_player" class="html5-video-player ad-showing"><video></video>
<div class="video-ads ytp-ad-module"><div class="ytp-ad-overlay-slot"><div class="ytp-ad-overlay-container"><div class="ytp-ad-text-overlay"><span class="ytp-ad-overlay-close-container"><button class="ytp-ad-overlay-close-button" aria-label="Close ad" id="x"><svg width="10" height="10"><path d="M0 0L10 10M10 0L0 10"/></svg></button></span>Sponsored message</div></div></div></div></div>
<script>document.getElementById('x').addEventListener('click',e=>{window.__closed++;e.currentTarget.closest('.ytp-ad-overlay-slot').remove();});</script></body></html>
