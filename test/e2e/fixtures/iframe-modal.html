<!doctype html>
<!-- modeled on generic iframe-hosted newsletter popup pattern, captured/authored 2026-11-05, NOT a live capture -->
<html lang="en"><head><meta charset="utf-8"><title>fixture</title>
<style>body{margin:0;font-family:sans-serif;min-height:100vh}.modal{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center}.box{background:#fff;padding:24px;min-width:300px;position:relative}</style>
<script>window.__closed=0;</script></head><body>
<main><h1>Page content</h1><p>Article text.</p></main>
<div class="modal" style="display:none" id="ov"><iframe id="f" src="iframe-modal-inner.html" style="width:400px;height:300px;border:0;background:#fff"></iframe></div>
<script>window.addEventListener('message',e=>{if(e.data==='closed'){window.__closed++;document.getElementById('ov').remove();}});setTimeout(()=>{document.getElementById('ov').style.display='flex'},300);</script></body></html>
