name: CI

on:
  push:
    branches: [main, claude/**]
  pull_request:
  schedule:
    # Weekly canary: catches YouTube/Spotify selector drift against fixtures and toolchain rot.
    - cron: "17 5 * * 1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:cov
      - run: npm run build
      - name: Validate manifest
        run: |
          if [ -f scripts/validate-manifest.mjs ]; then
            node scripts/validate-manifest.mjs
          else
            echo "scripts/validate-manifest.mjs not present; skipping"
          fi
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: E2E
        run: npx playwright test
      - name: Package
        run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: closeguard-dist
          path: |
            *.zip
            dist/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
