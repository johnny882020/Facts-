name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:cov
      - run: npm run build
      - name: Validate manifest
        run: |
          if [ -f scripts/validate-manifest.mjs ]; then node scripts/validate-manifest.mjs; fi
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - name: Package
        run: npm run package
      - name: Check tag matches package.json version
        run: |
          v="$(node -p "require('./package.json').version")"
          if [ "v$v" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} != package.json version v$v"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: closeguard-release-zip
          path: "*.zip"
          if-no-files-found: error

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: closeguard-release-zip
      - uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
          generate_release_notes: true

  chrome-web-store:
    needs: build
    runs-on: ubuntu-latest
    env:
      CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
      CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
      CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
      CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
    steps:
      - name: Check secrets
        id: gate
        run: |
          if [ -n "$CWS_CLIENT_ID" ] && [ -n "$CWS_CLIENT_SECRET" ] && [ -n "$CWS_REFRESH_TOKEN" ] && [ -n "$CWS_EXTENSION_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "CWS secrets absent; skipping Chrome Web Store publish."
          fi
      - uses: actions/download-artifact@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          name: closeguard-release-zip
      - name: Publish to Chrome Web Store
        if: steps.gate.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          # Chrome Web Store API v1.1 (https://developer.chrome.com/docs/webstore/using-api)
          # 1. Exchange the refresh token for a short-lived access token.
          TOKEN="$(curl -fsS https://oauth2.googleapis.com/token \
            -d client_id="$CWS_CLIENT_ID" -d client_secret="$CWS_CLIENT_SECRET" \
            -d refresh_token="$CWS_REFRESH_TOKEN" -d grant_type=refresh_token \
            | python3 -c 'import sys,json;print(json.load(sys.stdin)["access_token"])')"
          ZIP="$(ls *.zip | head -n1)"
          # 2. Upload the package: PUT /upload/chromewebstore/v1.1/items/{id}
          curl -fsS -X PUT \
            -H "Authorization: Bearer $TOKEN" -H "x-goog-api-version: 2" \
            -T "$ZIP" \
            "https://www.googleapis.com/upload/chromewebstore/v1.1/items/$CWS_EXTENSION_ID" \
            | tee upload.json
          python3 -c 'import json,sys;d=json.load(open("upload.json"));sys.exit(0 if d.get("uploadState")=="SUCCESS" else 1)'
          # 3. Publish: POST /chromewebstore/v1.1/items/{id}/publish
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" -H "x-goog-api-version: 2" -H "Content-Length: 0" \
            "https://www.googleapis.com/chromewebstore/v1.1/items/$CWS_EXTENSION_ID/publish"
